[package]
name = "mpex-server"
version = "0.1.0"
edition = "2024"
publish = false

# Split-brain rule (rust-state-ownership spec, "Inversion compatibility"): this crate must NOT
# depend on spt-native. The resident DB's statics live in the cdylib the CLR loads; linking the
# rlib here would create a second, divergent copy.
[dependencies]
# ponytail: nethost-download fetches libnethost from NuGet at build time; vendor the lib if an
# offline build environment ever appears.
netcorehost = { version = "0.22", features = ["nethost-download"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
