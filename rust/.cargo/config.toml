[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C",
    "target-cpu=x86-64-v3",
    "-C",
    "link-arg=-fuse-ld=mold",
    # SPIKE: mpex-server links spt-native as an rlib; --export-dynamic puts the #[no_mangle]
    # spt_* exports into the executable's .dynsym so the CLR can reach them through
    # NativeLibrary.GetMainProgramHandle() instead of a cdylib.
    "-C",
    "link-arg=-Wl,--export-dynamic",
]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]
