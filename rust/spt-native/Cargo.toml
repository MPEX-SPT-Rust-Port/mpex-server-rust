[package]
name = "spt-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "spt_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23"
rand = "0.9"
rand_xoshiro = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "io-util", "macros"] }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
