[package]
name = "spt-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "spt_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std", "simd-unsafe"] }
indexmap = { version = "2.14.0", default-features = false, features = ["std", "serde"] }
# `thread_rng` for `rand::rng()`; it pulls in `std`, `std_rng` and `sys_rng`.
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
rand_xoshiro = { version = "0.8", default-features = false }
rayon = { version = "1.12.0", default-features = false }
# Filter regexes from sptLogger.json. Deliberately -lite: filters compile once at init and run on a
# category string per line; .NET-only syntax (lookarounds, backreferences) degrades to never-match.
regex-lite = { version = "0.1", default-features = false, features = ["std", "string"] }
rmp-serde = { version = "=1.3.1", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# `preserve_order`: `serde_json::Map` keeps insertion order instead of sorting, which is what the C#
# `Dictionary`/`[JsonExtensionData]` pair it stands in for does. Without it every untyped object -
# `Item::location`, and every mod-added field replayed out of an `Extra` map - comes back alphabetised.
# `raw_value`: profile saves cross the boundary as one opaque JSON value and land on disk
# verbatim — the file must stay byte-identical to what C# serialized, never re-encoded.
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order", "raw_value"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "fs", "sync", "io-util", "macros"] }
walkdir = { version = "2", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
