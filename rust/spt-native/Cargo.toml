[package]
name = "spt-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "spt_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23"
indexmap = { version = "2.14.0", features = ["serde"] }
rand = "0.10"
rand_xoshiro = "0.8"
rayon = "1.12.0"
rmp-serde = "=1.3.1"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: `serde_json::Map` keeps insertion order instead of sorting, which is what the C#
# `Dictionary`/`[JsonExtensionData]` pair it stands in for does. Without it every untyped object -
# `Item::location`, and every mod-added field replayed out of an `Extra` map - comes back alphabetised.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "io-util", "macros"] }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
